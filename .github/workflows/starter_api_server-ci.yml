name: Node.js CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./starter/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: ./starter/api-server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
        continue-on-error: true
