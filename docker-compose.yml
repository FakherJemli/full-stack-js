# docker-compose.yml — Generated for monorepo (review before use)
version: '3.8'

services:

  starter_api_server:
    build:
      context: ./starter/api-server
      dockerfile: Dockerfile
    container_name: starter_api_server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    restart: unless-stopped

  finished_api_server:
    build:
      context: ./finished/api-server
      dockerfile: Dockerfile
    container_name: finished_api_server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
